name: Build GPT distributions

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "release" ]]; then
            TAG='${{ github.event.release.tag_name }}'
            if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
              echo "Invalid release tag: $TAG (expected v<semver>)" >&2
              exit 1
            fi
            VERSION="${TAG#v}"
          else
            VERSION="$(tr -d '[:space:]' < VERSION)"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build distributions
        run: python3 scripts/build_distributions.py --version '${{ steps.version.outputs.version }}'

      - name: Validate distributions
        run: python3 scripts/validate_distributions.py --version '${{ steps.version.outputs.version }}'

      - name: Upload Actions artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bradspelsdesigner-distributions-v${{ steps.version.outputs.version }}
          path: dist/*.zip
          retention-days: 14

      - name: Attach ZIPs to GitHub Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload '${{ github.event.release.tag_name }}' dist/*.zip --clobber
