name: Build GPT distributions (1.6.33)
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  distributions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML jsonschema
      - name: Pin and install canonical engine
        run: |
          curl --fail --location --retry 3 -o /tmp/gpt-byggaren-engine.zip https://github.com/erland/gpt-byggaren/releases/download/v1.6.33/gpt-byggaren-engine-1.6.33.zip
          mkdir -p /tmp/gpt-byggaren-engine
          unzip -q /tmp/gpt-byggaren-engine.zip -d /tmp/gpt-byggaren-engine
          python /tmp/gpt-byggaren-engine/scripts/selftest_distribution_engine.py --source /tmp/gpt-byggaren-engine
          python /tmp/gpt-byggaren-engine/scripts/install_distribution_engine.py --source /tmp/gpt-byggaren-engine --project-root .
      - name: Enforce release readiness
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          python - <<'PY'
          import os
          import re
          import yaml
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]
          prerelease = os.environ["RELEASE_PRERELEASE"] == "true"
          state = yaml.safe_load(Path("project-status.yaml").read_text(encoding="utf-8"))
          migration = state.get("migration", {})

          if prerelease:
              assert re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+-rc\.[1-9][0-9]*", tag), (
                  "Review pre-releases require vX.Y.Z-rc.N and the GitHub Pre-release flag"
              )
              print("Review pre-release permitted; runtime host acceptance is NOT VERIFIED")
          else:
              assert re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+", tag), (
                  "Production releases require vX.Y.Z without a pre-release suffix"
              )
              assert migration.get("release_ready") is True, (
                  "Production release blocked: migration.release_ready is not true"
              )
              assert migration.get("runtime_host_parity") == "verified", (
                  "Production release blocked: runtime host parity is not verified"
              )
              print("Production release approved")
          PY
      - name: Canonical GPT Byggaren 1.6.33 lint
        run: python /tmp/gpt-byggaren-engine/scripts/lint_gpt_project.py --project-root .
      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            V="${{ github.event.release.tag_name }}"
            if [[ "${{ github.event.release.prerelease }}" == "true" ]]; then
              [[ "$V" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-rc\.[1-9][0-9]*$ ]] || exit 1
              echo "value=${V#v}" >> "$GITHUB_OUTPUT"
            else
              [[ "$V" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
              echo "value=${V#v}" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "value=$(cat VERSION)" >> "$GITHUB_OUTPUT"
          fi
      - run: python scripts/build_distributions.py --version '${{ steps.version.outputs.value }}'
      - run: python scripts/validate_distributions.py
      - name: Verify canonical modular Skill packaging
        run: python scripts/validate_modular_skills_packaging.py
      - name: Verify modular Skill behavior content
        run: python scripts/verify_modular_content.py
      - name: G03 project ZIP inventory fixture tests
        run: python3 -m unittest discover -s tests -p 'test_g03_zip_inventory.py' -v
      - name: Export G03 host-test ZIP fixture
        run: python tests/export_g03_host_fixture.py
      - uses: actions/upload-artifact@v4
        with:
          name: G03-host-fixture
          path: build/host-fixtures/*
      - name: G01/G03 offline distribution preflight
        run: python scripts/check_g01_g03_preflight.py --dist dist --output build/acceptance-preflight.json
      - uses: actions/upload-artifact@v4
        with:
          name: boardgamedesigner-distributions
          path: |
            dist/*.zip
            build/acceptance-preflight.json
            build/modular-content-evidence.json
      - name: Attach distributions to published release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload '${{ github.event.release.tag_name }}' dist/*.zip --clobber
