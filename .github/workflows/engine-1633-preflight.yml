name: GPT Byggaren 1.6.33 original-engine preflight

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  engine-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install canonical engine test dependencies
        run: python3 -m pip install PyYAML
      - name: Install original engine (pinned version)
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --show-error --retry 3 \
            https://github.com/erland/gpt-byggaren/releases/download/v1.6.33/gpt-byggaren-engine-1.6.33.zip \
            --output /tmp/gpt-byggaren-engine-1.6.33.zip
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          source = Path('/tmp/gpt-byggaren-engine-1.6.33.zip')
          dest = Path('/tmp/gpt-byggaren-engine-1.6.33')
          with zipfile.ZipFile(source) as archive:
              members = archive.infolist()
              for item in members:
                  relative = Path(item.filename)
                  if relative.is_absolute() or '..' in relative.parts:
                      raise SystemExit(f'Unsafe engine archive path: {item.filename}')
              archive.extractall(dest)
          if not (dest / 'scripts/selftest_distribution_engine.py').is_file():
              raise SystemExit('Pinned engine self-test missing')
          print(f'Extracted {len(members)} original engine members')
          PY
      - name: Canonical engine integrity and six-archive self-test
        shell: bash
        run: |
          set -euo pipefail
          python3 /tmp/gpt-byggaren-engine-1.6.33/scripts/selftest_distribution_engine.py \
            --source /tmp/gpt-byggaren-engine-1.6.33 \
            --output engine-selftest.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gpt-byggaren-1.6.33-engine-selftest
          path: engine-selftest.json

  project-diagnostics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PyYAML
        run: python3 -m pip install PyYAML
      - name: Fetch pinned canonical engine
        shell: bash
        run: |
          set -euo pipefail
          curl -fLsS --retry 3 https://github.com/erland/gpt-byggaren/releases/download/v1.6.33/gpt-byggaren-engine-1.6.33.zip -o /tmp/engine-1633.zip
          python3 - <<'PY'
          import pathlib, zipfile
          root = pathlib.Path('/tmp/gpt-byggaren-engine-1.6.33')
          with zipfile.ZipFile('/tmp/engine-1633.zip') as z:
              for item in z.infolist():
                  p = pathlib.PurePosixPath(item.filename)
                  if p.is_absolute() or '..' in p.parts:
                      raise SystemExit('Unsafe ZIP entry')
              z.extractall(root)
          PY
      - name: Diagnose repository profile with original engine
        shell: bash
        run: |
          set +e
          set -uo pipefail
          python3 /tmp/gpt-byggaren-engine-1.6.33/scripts/lint_gpt_project.py --project-root . > project-lint-1633.json 2> project-lint-1633.stderr
          lint_exit=$?
          python3 /tmp/gpt-byggaren-engine-1.6.33/scripts/build_distributions.py --project-root . --version 1.0.0 > project-build-1633.log 2>&1
          build_exit=$?
          python3 - "$lint_exit" "$build_exit" <<'PY'
          import json, sys
          lint_exit, build_exit = (int(x) for x in sys.argv[1:])
          with open("project-engine-diagnostics.json", "w") as stream:
              json.dump({"engine": "1.6.33", "lint_exit": lint_exit, "build_exit": build_exit,
                         "project_migration_verified": lint_exit == 0 and build_exit == 0}, stream, indent=2)
          PY
          cat project-engine-diagnostics.json
          # Diagnostic until canonical project profile is migrated, not a release gate.
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gpt-byggaren-1.6.33-project-diagnostics
          path: |
            project-lint-1633.json
            project-lint-1633.stderr
            project-build-1633.log
            project-engine-diagnostics.json

  migration-inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install PyYAML
      - name: Report current source migration gaps
        run: python3 scripts/audit_1633_readiness.py > migration-readiness.json && cat migration-readiness.json
      - uses: actions/upload-artifact@v4
        with:
          name: gpt-byggaren-1.6.33-migration-readiness
          path: migration-readiness.json
