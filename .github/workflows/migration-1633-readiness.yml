name: GPT Byggaren 1.6.33 migration readiness
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML
      - name: Report missing 1.6.33 migration resources
        run: python scripts/audit_1633_readiness.py | tee migration-readiness.json
      - uses: actions/upload-artifact@v4
        with:
          name: migration-readiness-report
          path: migration-readiness.json
