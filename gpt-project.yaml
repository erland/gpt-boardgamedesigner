schema_version: 1
project:
  id: boardgamedesigner
  name: Brädspelsdesigner
  profile: iterative_design_and_production_assistant
  language: sv
  description: 'Brädspelsdesigner: idéutveckling, spelmekanik, regler, balansering,
    speltest och print-and-play.'
  version: 1.0.0
instructions:
  mode: modular_skills
  core: canonical/core.md
  canonical: canonical/core.md
  legacy_source: gpt-final-config/final-instructions-under-8000-chars.md
  preserve_legacy_source_byte_identical: true
knowledge_architecture:
  canonical_root: knowledge
  expected_files: 16
  mirror_root: knowledge
  mirror_numbered_files: 15
runtime:
  primary: none
  chat_zip:
    enabled: true
    bundle_distribution_engine: false
    role: peer_distribution
    allow_richer_runtime_than_custom_gpt: true
    entrypoint: START-HERE.md
    schema: schemas/chat-zip-runtime.schema.json
    start_here_template: templates/START-HERE.chat.md.tpl
    layout:
      assistant: assistant
      knowledge: knowledge
      schemas: schemas
      scripts: scripts
      templates: templates
      runtime: runtime
    include:
      instructions:
      - src/instructions/system.md
      policies:
      - src/runtime-policy/*.md
      conversation_starters:
      - src/conversation-starters/**
      knowledge:
      - knowledge/**
      schemas:
      - schemas/**
      scripts:
      - scripts/**
      templates:
      - templates/**
    exclude:
    - docs/**
    - tests/**
    - evals/**
    - research/**
    - .github/**
    - .git/**
    - build/**
    - dist/**
    - project-status.yaml
    - PROJECT.md
    - STATUS.md
    manifest:
      required: true
      checksums: true
    deterministic_build: true
    omit_empty_runtime_directories: true
  claude:
    enabled: true
    role: peer_distribution
    mode: claude_project
    schema: schemas/claude-portable-runtime.schema.json
    project:
      instructions: project/instructions.md
      knowledge: project/knowledge
      runtime_contract: project/runtime-contract.json
    templates:
      readme: templates/README.claude.md.tpl
    validation:
      require_instructions: true
      require_runtime_contract: true
  opencode:
    enabled: true
    role: peer_distribution
    mode: opencode_workspace
    schema: schemas/opencode-runtime.schema.json
    layout:
      instructions: AGENTS.md
      config: opencode.json
      tools: .opencode/tools
      runtime_scripts: scripts
      runtime_contract: .opencode/runtime-contract.json
      knowledge: knowledge
    templates:
      readme: templates/README.opencode.md.tpl
    skills:
      enabled: true
      directory: .opencode/skills
      definitions: []
    validation:
      require_agents_md: true
      require_runtime_contract: true
  plugin:
    enabled: true
    role: peer_distribution
    mode: openai_plugin
    schema: schemas/plugin-runtime.schema.json
    layout:
      manifest_file: plugin.json
      skills: skills
      references: references
      assets: assets
      scripts: scripts
    templates:
      readme: templates/README.plugin.md.tpl
    validation:
      require_manifest: true
      require_skill: true
      require_skill_frontmatter: true
  custom_gpt:
    enabled: false
    role: peer_distribution
    compilation_mode: adaptive
    allow_reduced_functionality: true
    platform_limits:
      instruction_max_characters: 8000
      knowledge_max_files: 20
    notes:
    - Platform limits are configuration values and must be easy to update.
    - Custom GPT and Chat ZIP are peer distribution targets derived from the same
      canonical contract.
    schema: schemas/custom-gpt-compilation.schema.json
    instruction:
      mode: compressed
      max_characters: 8000
    knowledge:
      strategy: hybrid
      max_files: 20
    builder:
      instructions: builder/instructions.md
      conversation_starters: builder/conversation-starters.md
      capabilities: builder/capabilities.md
      runtime_contract: builder/runtime-contract.json
      knowledge_package: builder/knowledge-package
    templates:
      readme: templates/README.custom-gpt.md.tpl
      compatibility: templates/COMPATIBILITY.md.tpl
      capabilities: templates/capabilities.md.tpl
    compatibility:
      report_required: true
      parity_symbols:
        equivalent: ✓
        reduced: '~'
        missing: '-'
    validation:
      block_on_instruction_limit: true
      block_on_knowledge_limit: true
      block_on_misleading_core_functionality: true
capabilities:
  contract_version: 1
  recommendation_mode: inferred_from_use_case
  requirements:
    filesystem:
      read: required
      write: required
    code_execution:
      level: recommended
    web:
      level: optional
    image_generation:
      level: optional
    structured_data:
      level: required
    persistent_state:
      level: recommended
release:
  version_file: VERSION
  preserve_current_version: true
  current_version: 1.0.0
workspace_state:
  contract_version: 1
  workspace:
    requirement: optional
    persistence: preferred
    portable: true
    separate_from_assistant: true
  state:
    requirement: optional
    persistence: preferred
    authority: workspace_file
    conversation_fallback: true
    format: yaml
    path: project-status.yaml
  runtime_preferences:
    chat: conversation_or_file
    agent: runtime_managed
  schema: schemas/workspace-state-contract.schema.json
structure:
  canonical_root: src
  instructions:
    path: assistant
    required: true
  conversation_starters:
    path: gpt-final-config
    required: true
  runtime_policy:
    path: runtime-policy
    required: false
  knowledge:
    path: knowledge
    required: false
  templates:
    path: templates
    required: false
  schemas:
    path: schemas
    required: false
  scripts:
    path: scripts
    required: false
  tests:
    path: tests
    required: false
  evals:
    path: evals
    required: false
  research:
    path: research
    required: false
  build:
    path: build
    generated: true
    create_when_needed: true
  dist:
    path: dist
    generated: true
    create_when_needed: true
build_system:
  build_script: scripts/build_distributions.py
  validation_script: scripts/validate_distributions.py
  targets:
  - project
  - chat
  - claude_project
  - claude_skills
  - opencode
  - plugin
  runtime_targets:
    chat:
      runtime_id: chatgpt_chat
      runtime_key: chat_zip
      builder: chat
      artifact_type: chat_zip
      filename_pattern: <project-id>-chat-<version>.zip
    claude_project:
      runtime_id: claude_project
      runtime_key: claude
      builder: claude
      artifact_type: claude_project_zip
      filename_pattern: <project-id>-claude-project-<version>.zip
    claude_skills:
      runtime_id: claude_skills
      runtime_key: claude
      builder: claude_skills
      artifact_type: claude_skills_zip
      filename_pattern: <project-id>-claude-skills-<version>.zip
    opencode:
      runtime_id: opencode
      runtime_key: opencode
      builder: opencode
      artifact_type: opencode_zip
      filename_pattern: <project-id>-opencode-<version>.zip
    plugin:
      runtime_id: openai_plugin
      runtime_key: plugin
      builder: plugin
      artifact_type: plugin_zip
      filename_pattern: <project-id>-plugin-<version>.zip
  output_root: dist
  working_root: build
  deterministic_zip: true
  manifest: true
  checksums: sha256
  project_zip_excludes:
  - build/**
  - dist/**
  - .git/**
  - '**/__pycache__/**'
  - '**/.pytest_cache/**'
skills:
  contract_version: 1
  mode: modular_skills
  resource_policy: explicit
  definitions:
  - id: game-design
    name: game-design
    description: Aktiveras för spelidéer, spelkategori, kärnloop, mekanikkritik och nybörjarprototyper.
    source: canonical/skills/game-design/behavior.md
    references:
    - knowledge/game-category-patterns.md
    - knowledge/mechanics-and-balance-patterns.md
    - knowledge/first-time-designer-guided-workflow.md
    - knowledge/existing-game-analysis-framework.md
    assets: []
    scripts: []
  - id: rules-playtest
    name: rules-playtest
    description: Aktiveras för regelbok, blindtest, speltest, balans och regeltydlighet.
    source: canonical/skills/rules-playtest/behavior.md
    references:
    - knowledge/rulebook-structure-standard.md
    - knowledge/playtest-and-balancing-guide.md
    - knowledge/blindtest-and-rule-clarity-guide.md
    assets: []
    scripts: []
  - id: print-and-play
    name: print-and-play
    description: Aktiveras för komponentdesign, grafisk produktion och utskriftsunderlag.
    source: canonical/skills/print-and-play/behavior.md
    references:
    - knowledge/component-design-guide.md
    - knowledge/component-economy-and-production-tradeoffs.md
    - knowledge/print-and-play-production-guide.md
    assets: []
    scripts: []
  - id: project-lifecycle
    name: project-lifecycle
    description: Aktiveras för ZIP-import, projektändring, käll-/outputhantering, versionshantering och release.
    source: canonical/skills/project-lifecycle/behavior.md
    references:
    - knowledge/boardgame-project-standard.md
    - knowledge/example-project-pattern.md
    - knowledge/release-and-build-workflow.md
    - knowledge/llm-boardgame-design-workflow.md
    - knowledge/gpt-role-and-working-style.md
    assets: []
    scripts: []
  schema: schemas/skill-contract.schema.json

tools:
  contract_version: 1
  tools: []
engine:
  enabled: false
development:
  plan: docs/development-plan.md
  status: project-status.yaml
  human_readable_status: STATUS.md
  project_documentation:
  - PROJECT.md
